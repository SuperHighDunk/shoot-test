<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SHOOT TEST</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #MMFCanvas {
            display: block;
            width: 640px;
            height: 480px;
            border: 1px solid red;
        }
    </style>
</head>

<body>

    <canvas
        id="MMFCanvas"
        width="640"
        height="480">
    </canvas>

    <script>

        /*
         * GLOBAL SCORE STORAGE
         *
         * Fusion can call sendTestScore()
         * without needing to pass an argument.
         *
         * Later, we can replace this test value
         * with the actual Fusion score.
         */
        window.SHD_TEST_SCORE = 1701;


        /*
         * FUSION CALL
         */
        function sendTestScore()
        {
            console.log("=== FUSION JAVASCRIPT TEST ===");

            console.log(
                "STORED SCORE:",
                window.SHD_TEST_SCORE
            );

            console.log(
                "STORED SCORE TYPE:",
                typeof window.SHD_TEST_SCORE
            );

            console.log(
                "NUMBER OF ARGUMENTS:",
                arguments.length
            );

            console.log(
                "=== END FUSION TEST ==="
            );
        }


        /*
         * TEST FUNCTION
         *
         * We can use this later to change
         * the stored score from Fusion.
         */
        function setSHDTestScore(value)
        {
            window.SHD_TEST_SCORE = Number(value);

            console.log(
                "SHD TEST SCORE SET TO:",
                window.SHD_TEST_SCORE
            );
        }

    </script>

    <script src="src/Runtime.js"></script>

    <script>
        new Runtime(
            "MMFCanvas",
            "resources/SHOOT TEST.cch"
        );
    </script>

</body>
</html>
