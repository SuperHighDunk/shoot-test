<!DOCTYPE html>

<html lang="en">

<head>

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>

<meta name="viewport" content="width=device-width, initial-scale=1" />

<style type="text/css">

html {
    height: 100%;
}

body {

    background-repeat: no-repeat;

    background-attachment: fixed;

    height: 100%;

    min-height: 100%;

    margin: 0;

    background: rgb(238,238,238);

    background: -moz-linear-gradient(
        top,
        rgba(238,238,238,1) 0%,
        rgba(204,204,204,1) 100%
    );

    background: -webkit-linear-gradient(
        top,
        rgba(238,238,238,1) 0%,
        rgba(204,204,204,1) 100%
    );

    background: -o-linear-gradient(
        top,
        rgba(238,238,238,1) 0%,
        rgba(204,204,204,1) 100%
    );

    background: -ms-linear-gradient(
        top,
        rgba(238,238,238,1) 0%,
        rgba(204,204,204,1) 100%
    );

    background: linear-gradient(
        to bottom,
        rgba(238,238,238,1) 0%,
        rgba(204,204,204,1) 100%
    );

}

h1 {

    font-family: Arial, Helvetica, sans-serif;

    color: #962300;

    font-size: 25px;

}

p {

    font-family: Arial, Helvetica, sans-serif;

    color: #777;

    font-size: 12px;

}

#bloctxt {

    border-left-width: 5px;

    border-left-style: solid;

    border-left-color: #962300;

    padding-left: 10px;

    position: absolute;

    top: 5%;

    left: 50%;

    width: 600px;

    margin-left: -260px;

}

#wrapper {

    padding: 10px;

    margin: 0 auto;

}

#border {

    background-color: #99C;

    border: 1px solid #B90000;

    -webkit-border-radius: 7px;

    -moz-border-radius: 7px;

    border-radius: 7px;

    margin: 0 auto;

    padding: 5px;

    width: 640px;

    height: 480px;

}

#canvas {

    width: 640px;

    height: 480px;

}

#MMFCanvas {

    -webkit-box-shadow:
        0px 0px 4px 4px rgba(0, 0, 0, 0.25);

    box-shadow:
        0px 0px 4px 4px rgba(0, 0, 0, 0.25);

}

</style>

<title>
    Clickteam Fusion 2.5 HTML5 Runtime
</title>


<script>

    if (!document.createElement("canvas").getContext)
    {
        window.open(
            "http://www.clickteam.com/html5-fallback",
            "_self"
        );
    }

</script>


<!-- Loads the Clickteam Fusion Runtime -->

<script src="src/Runtime.js"></script>


<!-- SUPER HIGH DUNK SCORE BRIDGE -->

<script>

    function sendTestScore(score)
    {

        console.log(
            "RAW SCORE FROM FUSION:",
            score
        );

        console.log(
            "RAW SCORE TYPE:",
            typeof score
        );


        window.parent.postMessage(

            {
                type: "TEST_SCORE",

                score: score
            },

            "*"

        );


        console.log(
            "TEST SCORE SENT TO WIX:",
            score
        );

    }

</script>


<script>

    if (window.location.protocol == "file:")
    {

        document.write(
            '<div id="bloctxt">'
        );

        document.write(
            '<h1>The application cannot be run...</h1>'
        );

        document.write(
            '<p>HTML browsers do not allow you to launch data files directly from the file system.<br>'
        );

        document.write(
            'A drag & drop of the html file on a web-browser window will not work, on any machine.<br>'
        );

        document.write(
            'Please use the Build & Run option (it opens a local web server) to run your application,<br>'
        );

        document.write(
            'or upload your application folder to a remote web-server, and start it from there...</p>'
        );

        document.write(
            '</div>'
        );

        throw new error(
            "Cannot run application"
        );

    }

</script>

</head>


<body>


<div id="wrapper">

    <div id="border">

        <div id="canvas">

            <canvas
                id="MMFCanvas"
                width="640"
                height="480"
            >

                <p>
                    Your browser does not support Canvas.
                </p>

            </canvas>

        </div>

    </div>

</div>


<script>

    // RUNTIMESTART

    window.addEventListener(
        "load",
        windowLoaded,
        false
    );


    function windowLoaded()
    {

        new Runtime(
            "MMFCanvas",
            "resources/SHOOT TEST.cch"
        );

    }

    // RUNTIMESTARTEND

</script>


<p align="center">

    Clickteam Fusion 2.5 HTML5 template.

</p>


</body>

</html>
