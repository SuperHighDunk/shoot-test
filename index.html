<!DOCTYPE html>
<html lang="en">

<head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <style>

        html {
            height: 100%;
        }

        body {
            height: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #wrapper {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #canvas {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #MMFCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

    </style>

    <title>Super High Dunk - SCORE TEST</title>

    <script src="src/Runtime.js"></script>

    <script>

        /*
         * FUSION SCORE FUNCTION
         *
         * Fusion's HTML5 Object calls this function.
         * The Integer Parameter added in Fusion
         * supplies the score value.
         */

        function sendTestScore(score)
        {
            console.log(
                "RAW SCORE FROM FUSION:",
                score
            );

            console.log(
                "RAW SCORE TYPE:",
                typeof score
            );

            window.parent.postMessage(
                {
                    type: "TEST_SCORE",
                    score: score
                },
                "*"
            );

            console.log(
                "TEST SCORE SENT TO WIX:",
                score
            );
        }

    </script>

</head>


<body>

    <div id="wrapper">

        <div id="canvas">

            <canvas
                id="MMFCanvas"
                width="640"
                height="480"
            >
                <p>
                    Your browser does not support Canvas.
                </p>
            </canvas>

        </div>

    </div>


    <script>

        window.addEventListener(
            "load",
            windowLoaded,
            false
        );


        function windowLoaded()
        {
            new Runtime(
                "MMFCanvas",
                "resources/SHOOT TEST.cch"
            );
        }

    </script>

</body>

</html>
