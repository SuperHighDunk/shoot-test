<!DOCTYPE html>
<html lang="en">

<head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <style>

        html {
            height: 100%;
        }

        body {
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100%;
            min-height: 100%;
            margin: 0;
            background: rgb(238,238,238);
        }

        #wrapper {
            padding: 10px;
            margin: 0 auto;
        }

        #border {
            background-color: #99C;
            border: 1px solid #B90000;
            border-radius: 7px;
            margin: 0 auto;
            padding: 5px;
            width: 640px;
            height: 480px;
        }

        #canvas {
            width: 640px;
            height: 480px;
        }

        #MMFCanvas {
            width: 640px;
            height: 480px;
        }

    </style>

    <title>Super High Dunk - SCORE TEST</title>


    <script src="src/Runtime.js"></script>


    <script>

        function sendTestScore(score)
        {
            console.log(
                "RAW SCORE FROM FUSION:",
                score
            );

            console.log(
                "RAW SCORE TYPE:",
                typeof score
            );

            window.parent.postMessage(
                {
                    type: "TEST_SCORE",
                    score: score
                },
                "*"
            );

            console.log(
                "TEST SCORE SENT TO WIX:",
                score
            );
        }

    </script>

</head>


<body>

    <div id="wrapper">

        <div id="border">

            <div id="canvas">

                <canvas
                    id="MMFCanvas"
                    width="640"
                    height="480"
                >
                    <p>
                        Your browser does not support Canvas.
                    </p>
                </canvas>

            </div>

        </div>

    </div>


    <script>

        window.addEventListener(
            "load",
            windowLoaded,
            false
        );


        function windowLoaded()
        {
            new Runtime(
                "MMFCanvas",
                "resources/SHOOT TEST.cch"
            );
        }

    </script>

</body>

</html>
