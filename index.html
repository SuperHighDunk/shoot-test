<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SHOOT TEST</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #MMFCanvas {
            display: block;
            width: 640px;
            height: 480px;
            border: 1px solid red;
        }
    </style>
</head>

<body>

    <canvas
        id="MMFCanvas"
        width="640"
        height="480">
    </canvas>

    <script>

        window.SHD_TEST_SCORE = 1701;

        function sendTestScore()
        {
            console.log("=== FUSION JAVASCRIPT TEST ===");

            console.log(
                "STORED SCORE:",
                window.SHD_TEST_SCORE
            );

            console.log(
                "STORED SCORE TYPE:",
                typeof window.SHD_TEST_SCORE
            );

            console.log(
                "NUMBER OF ARGUMENTS:",
                arguments.length
            );

            for (let i = 0; i < arguments.length; i++)
            {
                console.log(
                    "ARGUMENT " + i + ":",
                    arguments[i]
                );

                console.log(
                    "ARGUMENT " + i + " TYPE:",
                    typeof arguments[i]
                );
            }

            console.log("=== END FUSION TEST ===");
        }

        function setSHDTestScore(value)
        {
            window.SHD_TEST_SCORE = Number(value);

            console.log(
                "SHD TEST SCORE SET TO:",
                window.SHD_TEST_SCORE
            );
        }

    </script>

    <script src="src/Runtime.js"></script>

    <script>
        /*
         * Keep a reference to the actual Fusion runtime.
         * This lets us inspect its internal objects from
         * Chrome DevTools.
         */
        window.SHD_RUNTIME = new Runtime(
            "MMFCanvas",
            "resources/SHOOT TEST.cch"
        );

        console.log(
            "SHD FUSION RUNTIME:",
            window.SHD_RUNTIME
        );
    </script>

</body>
</html>
