<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SHOOT TEST</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background: #000;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #MMFCanvas {
            display: block;
            margin: 0 auto;
            background: #fff;
        }
    </style>
</head>

<body>

<canvas
    id="MMFCanvas"
    width="640"
    height="480">
</canvas>

<script>

window.sendTestScore = function()
{
    var score = Number(window.SHD_TEST_SCORE);

    console.log("=== SENDING SCORE TO WIX ===");
    console.log("SCORE:", score);
    console.log("SCORE TYPE:", typeof score);

    if (!Number.isFinite(score))
    {
        console.error("INVALID SCORE:", window.SHD_TEST_SCORE);
        return;
    }

    window.parent.postMessage(
        {
            type: "TEST_SCORE",
            score: score
        },
        "*"
    );

    console.log("SCORE SENT TO PARENT:", score);
    console.log("=== END SCORE SEND ===");
};

</script>

<script src="src/Runtime.js"></script>

<script>

function windowLoaded()
{
    console.log("=== FUSION RUNTIME STARTING AFTER PAGE LOAD ===");

    new Runtime(
        "MMFCanvas",
        "resources/SHD HTML5 TEST.cch"
    );
}

window.addEventListener("load", windowLoaded, false);

</script>

</body>
</html>
