
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Super High Dunk</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #border {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            border: none;
            border-radius: 0;
            background: #000;
            overflow: hidden;
        }

        #canvas {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #MMFCanvas {
            display: block;
            width: 640px;
            height: 480px;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            flex: 0 0 auto;
            box-shadow: none;
        }
    </style>

    <script src="src/Runtime.js"></script>
</head>

<body>
    <div id="wrapper">
        <div id="border">
            <div id="canvas">
                <canvas id="MMFCanvas" width="640" height="480">
                    Your browser does not support Canvas.
                </canvas>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const canvas = document.getElementById("MMFCanvas");
            const container = document.getElementById("canvas");

            function fitGameCanvas() {
                const availableWidth = container.clientWidth;
                const availableHeight = container.clientHeight;

                if (!availableWidth || !availableHeight) {
                    return;
                }

                const scale = Math.min(
                    availableWidth / 640,
                    availableHeight / 480
                );

                canvas.style.width = (640 * scale) + "px";
                canvas.style.height = (480 * scale) + "px";
            }

            window.addEventListener("resize", fitGameCanvas);

            window.addEventListener("load", function () {
                fitGameCanvas();

                new Runtime(
                    "MMFCanvas",
                    "resources/SHD HTML5 TEST.cch"
                );
            });

            window.addEventListener("message", function (event) {
                if (event.data && event.data.type === "SHD_START_PLAY") {
                    window.parent.postMessage(
                        { type: "SHD_START_PLAY" },
                        "*"
                    );
                }
            });
        })();
    </script>
</body>
</html>
